name: CI

# Typecheck gate for PRs and pushes to main.
#
# `tsconfig.base.json` sets `noCheck: true` so day-to-day `tsc -b` (and
# every editor/intellisense engine) only EMITS the generated SDKs instead
# of checking them — checking 20 generated SDKs costs minutes and GBs.
# CI is where that cost is worth paying: `typecheck:ci` re-enables
# checking (`tsc -b --noCheck false`) across every package, so a
# generator or patch bug can't reach npm.
#
# `stacks/` is hand-written and lives outside the workspace with its own
# lockfile, so it gets its own job rather than riding along on `tsc -b`.

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so adding the `force-ci` label re-triggers the run.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (all packages, generated code included)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm & Bun
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install Node 24
        run: pnpm runtime set node 24 -g

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm typecheck:ci

  typecheck-stacks:
    # `stacks/github` is its own install root (its own bun.lock, its own
    # alchemy/effect versions), so it is not a workspace member and the
    # `typecheck` job above never sees it. Check it here instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stacks/github
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('stacks/github/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck (stack program and mirror fetch scripts)
        run: bun run typecheck

  format:
    name: Check formatting
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm & Bun
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          cache: true
          install: false

      - name: Install Node 24
        run: pnpm runtime set node 24 -g

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check
