name: Benchmarks

# Benchmarks a PR against main and comments the comparison on the PR.
#
# `benches/sdks/ci.ts` measures a fixed panel of SDKs (benches/sdks/ci.json)
# plus the SDKs the PR changes: 1-auth + 1-operation bundle size for every
# protocol, and for the small SDKs import heap, live objects, import time,
# first call, added call latency and download size. Offline, like every
# bench: each call hits a canned in-memory response.
#
# Main's numbers come from the Actions cache: every push to main runs the same
# script with `--wide` (every SDK), appends it to a rolling history (the line
# charts), and saves both under `bench-ci-main-<sha>-<run id>`. A PR restores
# the entry for its base commit, or the newest main entry when that is missing.
# Run the workflow by hand on main with `backfill: N` to seed the history with
# main's last N commits.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      backfill:
        description: Benchmark main's last N commits into the history first (about 3 min each)
        type: number
        default: 0

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks (PR vs main)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Depth 2: on a PR the checkout is the merge commit, and its first
      # parent is main, which is how ci.ts finds the SDKs the PR changes.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup pnpm, Node.js and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: true
          require-lockfile: true

      # On main, the previous entry holds the history this run appends to.
      - name: Restore main's benchmark
        id: main-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .bench-ci/main.json
            .bench-ci/history.json
          # Keys end in a run id, so the key never matches exactly: the base
          # commit's newest entry wins, then main's newest entry.
          key: bench-ci-main-${{ github.event.pull_request.base.sha || github.sha }}-none
          restore-keys: |
            bench-ci-main-${{ github.event.pull_request.base.sha || github.sha }}-
            bench-ci-main-

      - name: Backfill main's history
        if: github.event_name == 'workflow_dispatch' && inputs.backfill > 0
        env:
          N: ${{ inputs.backfill }}
        run: |
          mkdir -p .bench-ci
          git fetch -q --depth=$((N + 1)) origin "$GITHUB_SHA"
          for sha in $(git rev-list --first-parent -n "$((N + 1))" "$GITHUB_SHA" | tail -n +2 | tac); do
            dir="$RUNNER_TEMP/backfill-$sha"
            git worktree add -q --detach "$dir" "$sha"
            ./.github/bench-copy.sh "$dir"
            if (cd "$dir" && pnpm install --frozen-lockfile --prefer-offline > /dev/null \
                && BENCH_HEAD_SHA=$sha node benches/sdks/ci.ts run --wide --out "$RUNNER_TEMP/$sha.json"); then
              node benches/sdks/ci.ts history --history .bench-ci/history.json --add "$RUNNER_TEMP/$sha.json"
            else
              echo "::warning::backfill of $sha failed; skipped"
            fi
            git worktree remove --force "$dir"
          done

      - name: Benchmark
        env:
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCOPE: ${{ github.event_name == 'pull_request' && '--changed-since HEAD^1' || '--wide' }}
        run: |
          mkdir -p .bench-ci
          node benches/sdks/ci.ts run --out .bench-ci/head.json $SCOPE

      # No main run in the cache (the first PR after this job lands, or an
      # evicted entry): benchmark the base commit here, with this PR's runner
      # and the same SDK list. Doubles the job time, only on a miss.
      - name: Benchmark main (no cached run)
        if: github.event_name == 'pull_request' && steps.main-cache.outputs.cache-matched-key == ''
        env:
          BENCH_HEAD_SHA: ${{ github.event.pull_request.base.sha }}
          BENCH_SOURCE: same-job
        run: |
          base="$RUNNER_TEMP/base"
          git worktree add -q --detach "$base" HEAD^1
          ./.github/bench-copy.sh "$base"
          (cd "$base" && pnpm install --frozen-lockfile --prefer-offline > /dev/null)
          extra=$(node -p 'require("./.bench-ci/head.json").scope.changed.join(",")')
          (cd "$base" && node benches/sdks/ci.ts run --out "$GITHUB_WORKSPACE/.bench-ci/main.json" ${extra:+--extra "$extra"})

      - name: Add this run to main's history
        if: github.event_name != 'pull_request'
        run: |
          cp .bench-ci/head.json .bench-ci/main.json
          node benches/sdks/ci.ts history --history .bench-ci/history.json --add .bench-ci/head.json

      - name: Cache main's benchmark
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .bench-ci/main.json
            .bench-ci/history.json
          key: bench-ci-main-${{ github.sha }}-${{ github.run_id }}

      # Same bot as the website preview comment. Fork PRs get no secrets, so
      # they get the job summary only, with the text verdict.
      - name: Generate bot token
        id: bot-token
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ALCHEMY_VERSION_BOT_ID }}
          private-key: ${{ secrets.ALCHEMY_VERSION_BOT_PRIVATE_KEY }}

      # The comment is the headline numbers as text plus one PNG per chart, in
      # the bench dashboard's style, drawn with the runner's Chrome. A PR
      # comment can only show an image from a URL, so they are committed to the
      # orphan `bench-images` branch (pr-<number>/<head sha>/<chart>.png).
      - name: Publish the benchmark image
        id: image
        if: steps.bot-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          base=""; [ -f .bench-ci/main.json ] && base="--base .bench-ci/main.json"
          node benches/sdks/ci.ts image --head .bench-ci/head.json $base \
            --history .bench-ci/history.json --pr "$PR" --title "$TITLE" --out-dir .bench-ci/images
          remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          dir="$RUNNER_TEMP/bench-images"
          if git ls-remote --exit-code "$remote" refs/heads/bench-images > /dev/null; then
            git clone -q --depth 1 --branch bench-images "$remote" "$dir"
          else
            git init -q -b bench-images "$dir" && git -C "$dir" remote add origin "$remote"
          fi
          mkdir -p "$dir/pr-$PR/$SHA" && cp .bench-ci/images/*.png "$dir/pr-$PR/$SHA/"
          git -C "$dir" add -A
          git -C "$dir" -c user.name="alchemy-version-bot[bot]" -c user.email="alchemy-version-bot[bot]@users.noreply.github.com" \
            commit -q -m "bench: PR #$PR at $SHA"
          # Other PRs push here too: rebase and retry on a race.
          for attempt in 1 2 3; do
            git -C "$dir" push -q origin bench-images && break
            git -C "$dir" pull -q --rebase origin bench-images
          done
          echo "url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/bench-images/pr-$PR/$SHA" >> "$GITHUB_OUTPUT"

      - name: Write report
        env:
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_URL: ${{ steps.image.outputs.url }}
        run: |
          base=""
          if [ "${{ github.event_name }}" = pull_request ] && [ -f .bench-ci/main.json ]; then
            base="--base .bench-ci/main.json"
          fi
          node benches/sdks/ci.ts report --head .bench-ci/head.json $base ${IMAGE_URL:+--image-base "$IMAGE_URL"} --out .bench-ci/comment.md
          cat .bench-ci/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks
          path: .bench-ci/
          include-hidden-files: true
          retention-days: 30

      # One comment per PR, edited on every push.
      - name: Comment on the PR
        if: steps.bot-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- distilled-bench -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@.bench-ci/comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@.bench-ci/comment.md > /dev/null
          fi
