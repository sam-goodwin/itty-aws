name: update-specs

# Refreshes the vendored API specs we fetch ourselves. Ported from the
# per-spec repositories (alchemy-run/distilled-spec-*), which each ran this
# on their own schedule before the specs were folded into this repo.
#
# Unlike those repos, this one does NOT push to main: a spec change moves
# the generated SDKs, so it lands as a pull request and goes through the
# normal typecheck gate. Regenerating is deliberate and belongs in the same
# PR as the spec bump.

on:
  schedule:
    - cron: "0 0 * * *" # every 24 hours at midnight UTC
  workflow_dispatch:
    inputs:
      package:
        description: Only refresh this package (e.g. `neon`). Empty = all.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-specs
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Fetch specs
        env:
          ONLY: ${{ inputs.package }}
        run: |
          set -euo pipefail
          failed=""
          for dir in packages/*/scripts/fetch-specs.ts; do
            pkg=$(basename "$(dirname "$(dirname "$dir")")")
            if [ -n "$ONLY" ] && [ "$ONLY" != "$pkg" ]; then continue; fi
            echo "::group::$pkg"
            # One upstream being down must not block the others.
            if (cd "packages/$pkg" && bun scripts/fetch-specs.ts); then
              echo "$pkg ok"
            else
              echo "::warning::$pkg fetch failed"
              failed="$failed $pkg"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed:$failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/*/specs; then
            echo "No spec changes"
            exit 0
          fi
          date=$(date -u +%Y-%m-%d)
          branch="specs/update-$date"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- packages/*/specs
          git commit -m "chore(specs): update vendored specs $date"
          git push --force origin "$branch"
          # Reuse today's PR if the job already ran.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(specs): update vendored specs $date" \
              --body "Automated refresh of the vendored API specs.

          The generated SDKs are **not** regenerated here — run \`bun run generate\` in each
          package whose spec moved and push the output onto this branch, so the spec bump
          and the resulting SDK diff land together."
          fi
