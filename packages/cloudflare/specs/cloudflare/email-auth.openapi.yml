        `enabled` or `skip_wizard` must be provided. When enabling, the handler
        will ensure the DMARC RUA record exists in DNS.  @example ```ts const
        response = await client.emailAuth.dmarcReports.edit({ zone_id:
        '023e105f4ecef8ad9ca31a8372d0c353', }); ```"
      parameters:
        - name: zone_id
          in: path
          required: true
          description: "Path param: Identifier."
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
