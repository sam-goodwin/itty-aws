  /zones/{zone_id}/email/auth/spf/inspect:
    get:
      operationId: getSpfInspect
      description: "Inspects a specific SPF TXT record and returns a parsed tree
        structure in the spflimit-worker format.  The record ID must be provided
        via the `id` query parameter.  Returns a recursive tree showing:  -
        Parsed components with their qualifiers and types - Nested includes
        recursively resolved within components - Per-component and total lookup
        counts - Detailed error information with context  @example ```ts const
        inspect = await client.emailAuth.spf.inspect.get({ zone_id:
        '023e105f4ecef8ad9ca31a8372d0c353', id: 'id', }); ```"
      parameters:
        - name: zone_id
          in: path
          required: true
          description: "Path param: Identifier."
          schema:
            type: string
        - name: id
          in: query
          required: true
          description: "Query param: DNS record ID (rec_tag) to inspect"
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  components:
                    type: array
                    items: {}
                    description: Parsed SPF components (mechanisms)
                  domain:
                    type: string
                    description: Domain being inspected
                  record:
                    type: string
                    description: Raw SPF record content
                  total_lookups:
                    type: number
                    description: Total number of DNS lookups performed across all includes
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: "Error code. Known values:  - `lookup_failed` — DNS TXT lookup
                            failed - `spf_not_found` — no SPF record found -
                            `invalid_spf` — record does not start with `v=spf1`
                            - `invalid_domain` — PSL validation failed -
                            `loop_detected` — include/redirect cycle detected -
                            `invalid_mechanism` — unrecognised or malformed
                            mechanism - `resource_limit_exceeded` — internal
                            resource protection limits exceeded (recursion depth
                            or query budget) - `max_lookups` — RFC 7208
                            10-lookup limit exceeded"
                        domain:
                          type: string
                          description: Domain where the error occurred
                        message:
                          type: string
                          description: Human-readable error message
                        details:
                          type: string
                          description: 'Additional error-specific details (optional).  - For
                            `invalid_domain` errors: the invalid domain string -
                            For `invalid_mechanism` errors: the invalid
                            mechanism text (e.g., "invalidmech123") - For
                            `loop_detected` errors: the domain that caused the
                            loop - For other error types: not present'
                      required:
                        - code
                        - domain
                        - message
                    description: All errors encountered during inspection, collected from the entire
                      tree. This includes errors from nested includes at any
                      depth, providing a quick overview of all issues without
                      needing to traverse the nested structure. Each error
                      includes a `domain` field to identify where it occurred.
                      Empty array if no errors (omitted from JSON when empty).
                required:
                  - components
                  - domain
                  - record
                  - total_lookups
      x-distilled-response-path: result
